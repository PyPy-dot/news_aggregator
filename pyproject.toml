[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "database", "config"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG002", # unused method argument (too strict for async callbacks)
]

[tool.ruff.lint.isort]
force-single-line = false
lines-between-types = 1
known-first-party = ["services", "database", "config"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # unused imports in __init__
"tests/**/*.py" = ["ARG", "S101"]  # unused args in tests, assert allowed
"main.py" = ["E402"]  # module level import not at top of file (logging setup)
