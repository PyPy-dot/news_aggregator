name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  lint-and-type-check:
    name: Linting & Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff linting
        run: |
          ruff check . --output-format=github

      - name: Ruff format check
        run: |
          ruff format . --check

      - name: MyPy type checking
        run: |
          mypy . --ignore-missing-imports --no-strict-optional \
            --exclude .venv --exclude logs

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Create .env file for tests
        run: |
          cat > .env << EOF
          BOT_TOKEN=test_bot_token
          ENCRYPTION_KEY=test_encryption_key_for_ci_32chars
          API_ID=123456
          API_HASH=test_api_hash_for_ci
          PHONE_NUMBER=+79991234567
          CHANNEL_ID=-1001234567890
          PARSE_CHANNEL_ID=-1001234567891
          EOF

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --cov=services \
            --cov=database \
            --cov=config \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            logs/
          retention-days: 3

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install safety
        run: |
          pip install safety

      - name: Check dependencies for vulnerabilities
        run: |
          safety check -r requirements.txt --output github

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports
        run: |
          python -c "
          import services
          import database
          import config
          print('✅ Все импорты успешны')
          "
