<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему — News Aggregator Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <!-- Логотип -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fas fa-newspaper text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">News Aggregator</h1>
            <p class="text-gray-500 mt-1">Админ-панель</p>
        </div>

        <!-- Сообщение об ошибке -->
        {% if error %}
        <div class="mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
            <i class="fas fa-exclamation-circle mr-2"></i>
            {{ error }}
        </div>
        {% endif %}

        <!-- Форма входа -->
        <form method="POST" action="/auth/login" class="space-y-6">
            <!-- Логин -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-user mr-2 text-blue-500"></i>
                    Логин
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    value="{{ username if username else '' }}"
                    placeholder="Ваш логин"
                    autocomplete="username"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                />
            </div>

            <!-- Пароль -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-lock mr-2 text-green-500"></i>
                    Пароль
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Ваш пароль"
                    autocomplete="current-password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                />
            </div>

            <!-- Скрытое поле next -->
            <input type="hidden" name="next_url" value="{{ next }}">

            <!-- Кнопка входа -->
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-lg font-medium hover:from-blue-600 hover:to-purple-700 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
            >
                <i class="fas fa-sign-in-alt mr-2"></i>
                Войти в систему
            </button>
        </form>

        <!-- Информация -->
        <div class="mt-8 pt-6 border-t border-gray-200">
            <p class="text-xs text-center text-gray-400">
                Сессия действует 3 часа<br>
                Только для авторизованных администраторов
            </p>
        </div>

    <!-- Автофокус на поле логина -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // Автофокус на поле логина если оно пустое
            if (!usernameInput.value) {
                usernameInput.focus();
            } else {
                passwordInput.focus();
            }

            // Отправка формы по Enter
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    passwordInput.form.submit();
                }
            });
        });
    </script>
</body>
</html>
