# Nginx конфигурация для News Aggregator (Development)

events {
    worker_connections 1024;
}

http {
    # Основное приложение
    upstream app {
        server app:8000;
    }

    # Web админка
    upstream web_admin {
        server web-admin:8001;
    }

    # Основное приложение
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web админка
        location /admin {
            proxy_pass http://web_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
