# =============================================================================
# News Aggregator — Docker Compose (Development)
# =============================================================================
# Запуск:
#   docker-compose up -d
#
# Остановка:
#   docker-compose down
#
# Просмотр логов:
#   docker-compose logs -f
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Основное приложение (бот, listener, scheduler)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-aggregator-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://news:news_password@db:5432/news_aggregator
      - OLLAMA_HOST=http://ollama:11434
      - CHROMA_HOST=http://chromadb:8000
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - news-network
    ports:
      - "8000:8000"

  # ---------------------------------------------------------------------------
  # Web админка
  # ---------------------------------------------------------------------------
  web-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-aggregator-web
    restart: unless-stopped
    command: python -m services.web_admin.api.app
    environment:
      - DATABASE_URL=postgresql+asyncpg://news:news_password@db:5432/news_aggregator
      - WEB_ADMIN_JWT_SECRET=dev-secret-key-change-in-production
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    networks:
      - news-network
    ports:
      - "8001:8001"

  # ---------------------------------------------------------------------------
  # PostgreSQL — база данных
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: news-aggregator-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=news
      - POSTGRES_PASSWORD=news_password
      - POSTGRES_DB=news_aggregator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - news-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ChromaDB — векторный поиск
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: news-aggregator-chroma
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - news-network
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ollama — LLM
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: news-aggregator-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - news-network
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — кэш и очереди
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: news-aggregator-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - news-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: news-aggregator-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - web-admin
    networks:
      - news-network

  # ---------------------------------------------------------------------------
  # Prometheus — мониторинг и алертинг
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: news-aggregator-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - news-network
    depends_on:
      - app
      - web-admin

  # ---------------------------------------------------------------------------
  # Grafana — визуализация метрик
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: news-aggregator-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - news-network
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # AI Agent Microservice — отдельный сервис для AI-агентов
  # ---------------------------------------------------------------------------
  ai-agent-service:
    build:
      context: ./microservices/ai-agent-service
      dockerfile: Dockerfile
    container_name: news-aggregator-ai-agent
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - AGENT_MODEL=qwen2.5:7b
      - LOG_LEVEL=INFO
    depends_on:
      - ollama
    networks:
      - news-network
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Сети
# =============================================================================
networks:
  news-network:
    driver: bridge

# =============================================================================
# Тома для сохранения данных
# =============================================================================
volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
